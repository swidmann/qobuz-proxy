name: Validate

on:
  pull_request:
  push:
    branches: ['main', 'codex/**']
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.11'
          version: '0.13.6'
      - name: Install audio library
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2
      - run: uv sync --frozen --all-extras
      - run: uv run --no-sync ruff check qobuz_proxy/ tests/ tools/
      - run: uv run --no-sync ruff format --check qobuz_proxy/ tests/ tools/
      - run: uv run --no-sync python tools/check_types.py
      - run: uv run --no-sync pytest
